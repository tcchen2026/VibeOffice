<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lectern 2003</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400;0,700;1,400;1,700&family=Tinos:ital,wght@0,400;0,700;1,400;1,700&family=Cousine:wght@400;700&family=Carlito:ital,wght@0,400;0,700;1,400;1,700&family=Caladea:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout concept: a faithful Office 2003 (Luna Blue) application window — title bar, docked command bars,
   three-pane Normal view (slides/outline · slide · task pane), drawing bar and status bar. Single deliberate theme. */
[hidden] { display: none !important; }
:root {
  color-scheme: light;
  --ui-font: Tahoma, "Segoe UI", Verdana, Geneva, "DejaVu Sans", sans-serif;
  --ui-size: 11px;
  /* command bars (Office 2003 blue) */
  --tb-a: #E3EFFF; --tb-b: #CBE1FC; --tb-c: #7BA4E0;
  --dock-a: #9EBEF5; --dock-b: #C4DAFA;
  --tb-border: #3B619C; --grip: #274176;
  --hot-a: #FFF4CC; --hot-b: #FFD091; --hot-border: #000080;
  --press-a: #FE803E; --press-b: #FFDF9A;
  --chk-a: #FFDF9A; --chk-b: #FFA64C;
  --menu-border: #002D96; --menu-hot: #FFEEC2; --sep-dark: #6A8CCB; --sep-light: #F1F9FF;
  --pane-a: #EEF4FD; --pane-b: #D2E1F8; --pane-ink: #0B2E7C; --pane-link: #0B3FA8;
  --work: #B7C6E2; --ink: #000000; --muted: #4c5a72;
  --dlg: #ECE9D8; --dlg-ink: #000; --field-border: #7F9DB9; --btn-border: #003C74;
  --sel: #316AC5; --white: #FFFFFF;
}
html, body { height: 100%; }
body { margin: 0; background: var(--dock-b); color: var(--ink); font: var(--ui-size)/1.25 var(--ui-font); overflow: hidden; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
input, select, textarea { font: inherit; color: var(--ink); }
:focus-visible { outline: 1px dotted #000; outline-offset: 1px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }

.app { display: flex; flex-direction: column; height: 100%; min-width: 0; }
/* ---------- title bar ---------- */
.titlebar { flex: none; height: 26px; display: flex; align-items: center; gap: 6px; padding: 0 8px; color: #fff; font: bold 12px/1 "Trebuchet MS", var(--ui-font);
  text-shadow: 1px 1px 0 #0a1a4a; background: linear-gradient(#0058EE 0%, #3593FF 4%, #288EFF 6%, #127DFF 8%, #036FFC 10%, #0262EE 14%, #0057E5 20%, #0054E3 24%, #0055EB 56%, #005BF5 66%, #026AFE 76%, #0062EF 86%, #0052D6 92%, #0040AB 94%, #003092 100%);
  border-bottom: 1px solid #00238a; white-space: nowrap; overflow: hidden; }
.titlebar .title-text { overflow: hidden; text-overflow: ellipsis; }
.titlebar .appico { flex: none; filter: drop-shadow(0 0 1px rgba(255,255,255,.6)); }
/* ---------- command bars ---------- */
.cmdbars { flex: none; background: linear-gradient(90deg, var(--dock-a), var(--dock-b)); border-bottom: 1px solid #6f93cf; }
.menurow { display: flex; align-items: center; gap: 8px; padding: 2px 4px 1px; min-height: 24px; overflow-x: auto; scrollbar-width: none; }
.menurow::-webkit-scrollbar { display: none; }
.menubar { display: flex; align-items: center; flex: none; padding-left: 4px; position: relative; }
.menubar::before { content: ""; width: 3px; height: 16px; margin-right: 5px; background: radial-gradient(circle, var(--grip) 1px, transparent 1.2px) 0 0 / 3px 4px; }
.mb-item { padding: 3px 7px 4px; border: 1px solid transparent; cursor: default; white-space: nowrap; user-select: none; }
.mb-item:hover { background: linear-gradient(var(--hot-a), var(--hot-b)); border-color: var(--hot-border); }
.mb-item.open { background: linear-gradient(var(--tb-a), #93B5E7); border-color: var(--menu-border); border-bottom-color: transparent; position: relative; z-index: 1001; }
.helpbox { margin-left: auto; flex: none; display: flex; align-items: center; gap: 2px; }
.helpbox input { width: 170px; height: 19px; border: 1px solid #7B9EBD; padding: 1px 4px; color: #333; }
.helpbox input::placeholder { color: #6b6b6b; }
.toolbars { display: flex; flex-direction: column; gap: 0; padding: 0 2px 2px; }
.tb-row { display: flex; flex-wrap: wrap; align-items: stretch; gap: 2px 3px; min-height: 26px; }
.toolbar { display: inline-flex; align-items: center; height: 26px; padding: 0 2px 0 0; border-radius: 3px; border-bottom: 1px solid var(--tb-border); border-right: 1px solid #5e85c6;
  background: linear-gradient(var(--tb-a), var(--tb-b) 50%, var(--tb-c)); max-width: 100%; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; flex: none; }
.toolbar::-webkit-scrollbar { display: none; }
.tb-grip { flex: none; width: 7px; height: 18px; margin: 0 2px 0 3px; background: radial-gradient(circle at 1px 1px, var(--grip) 0.8px, transparent 1px) 0 0 / 4px 4px, radial-gradient(circle at 2px 2px, #fff 0.8px, transparent 1px) 0 0 / 4px 4px; }
.tb-sep { flex: none; width: 2px; height: 18px; margin: 0 3px; border-left: 1px solid var(--sep-dark); border-right: 1px solid var(--sep-light); }
.tb-end { flex: none; width: 2px; }
.tb-btn { flex: none; display: inline-flex; align-items: center; gap: 3px; height: 22px; min-width: 23px; padding: 0 3px; border: 1px solid transparent; background: none; border-radius: 0; cursor: default; justify-content: center; }
.tb-btn .ico { display: block; flex: none; }
.tb-btn.with-label { padding: 0 5px 0 3px; }
.tb-btn:not(.dis):hover, .tb-dd:hover, .tb-split:hover > .tb-btn:not(.dis) { background: linear-gradient(var(--hot-a), var(--hot-b)); border-color: var(--hot-border); }
.tb-split:hover > .tb-dd { background: linear-gradient(var(--hot-a), var(--hot-b)); border-color: var(--hot-border); }
.tb-btn:not(.dis):active { background: linear-gradient(var(--press-a), var(--press-b)); border-color: var(--hot-border); }
.tb-btn.on { background: linear-gradient(var(--chk-a), var(--chk-b)); border-color: var(--hot-border); }
.tb-btn.on:hover { background: linear-gradient(var(--press-a), var(--press-b)); }
.tb-btn.dis { opacity: .38; filter: grayscale(1); }
.tb-split { display: inline-flex; flex: none; }
.tb-split .tb-btn { min-width: 21px; padding-right: 1px; }
.tb-dd { width: 12px; height: 22px; border: 1px solid transparent; background: none; padding: 0; display: inline-flex; align-items: center; justify-content: center; cursor: default; }
.dd-arrow { display: inline-block; width: 0; height: 0; border-left: 3px solid transparent; border-right: 3px solid transparent; border-top: 3px solid #000; margin-left: 2px; }
.tb-lbl { white-space: nowrap; }
.combo { flex: none; display: inline-flex; height: 19px; margin: 0 2px; border: 1px solid #7B9EBD; background: #fff; }
.combo.focus, .combo:hover { border-color: var(--hot-border); }
.combo.dis { opacity: .5; }
.combo-in { flex: 1; min-width: 0; border: 0; padding: 0 3px; height: 17px; outline: none; background: transparent; }
.combo-btn { flex: none; width: 13px; border: 0; border-left: 1px solid #c0d0ea; background: linear-gradient(var(--tb-a), var(--tb-b)); padding: 0; display: flex; align-items: center; justify-content: center; }
.combo-btn:hover { background: linear-gradient(var(--hot-a), var(--hot-b)); }
/* ---------- menus ---------- */
.menu { position: fixed; z-index: 1000; min-width: 150px; max-height: calc(100% - 8px); overflow-y: auto; background: #fff linear-gradient(90deg, var(--tb-a), var(--tb-b) 18px, var(--tb-c) 25px, #FCFCF9 25px) no-repeat; border: 1px solid var(--menu-border); padding: 2px; box-shadow: 2px 2px 3px rgba(0,0,0,.35); user-select: none; outline: none; }
.menu.from-bar { margin-top: 0; }
.m-item { display: grid; grid-template-columns: 22px 1fr auto 12px; align-items: center; min-height: 21px; border: 1px solid transparent; cursor: default; padding-right: 2px; white-space: nowrap; }
.m-item.act:not(.dis) { background: var(--menu-hot); border-color: var(--hot-border); }
.m-item.dis { color: #8d8d8d; }
.m-item.dis .ico { opacity: .35; filter: grayscale(1); }
.m-ico { display: flex; align-items: center; justify-content: center; width: 20px; height: 19px; }
.m-ico.on { background: var(--chk-b); border: 1px solid var(--hot-border); }
.m-check { font-weight: bold; color: #000; }
.m-radio { font-size: 8px; }
.m-lbl { padding: 0 10px 0 8px; }
.m-key { padding-left: 18px; color: inherit; }
.m-sub { font-size: 7px; text-align: right; }
.m-sep { height: 1px; margin: 2px 2px 2px 28px; background: var(--sep-dark); }
.menu.combo-list .m-lbl { font-size: 13px; }
.menu.combo-list.fonts .m-item { min-height: 24px; }
.menu.grid-menu { padding: 3px; }
.shape-grid { display: grid; grid-template-columns: repeat(8, 24px); gap: 1px; padding: 2px; background: #fff; }
.shape-grid button { width: 24px; height: 24px; border: 1px solid transparent; background: none; padding: 0; display: flex; align-items: center; justify-content: center; }
.shape-grid button:hover { background: var(--menu-hot); border-color: var(--hot-border); }
.menu-title { padding: 2px 4px 3px 28px; font-weight: bold; color: var(--pane-ink); }
.style-list { display: flex; flex-direction: column; background: #fff; min-width: 150px; }
.style-list button { display: flex; align-items: center; gap: 8px; height: 22px; border: 1px solid transparent; background: none; padding: 0 6px; text-align: left; }
.style-list button:hover { background: var(--menu-hot); border-color: var(--hot-border); }
.style-list svg { flex: none; }
/* colour panel */
.color-panel { display: flex; flex-direction: column; gap: 3px; padding: 3px; background: #fff; min-width: 172px; }
.cp-wide { height: 22px; border: 1px solid transparent; background: none; text-align: center; }
.cp-wide:hover { background: var(--menu-hot); border-color: var(--hot-border); }
.cp-sep { height: 1px; background: #c5c5c5; margin: 1px 0; }
.cp-row, .cp-grid { display: grid; grid-template-columns: repeat(8, 18px); gap: 3px; justify-content: center; }
.cp-sw { width: 18px; height: 18px; border: 1px solid #808080; padding: 0; box-shadow: inset 0 0 0 1px #fff; }
.cp-sw:hover { outline: 1px solid var(--hot-border); outline-offset: 1px; }
/* ---------- main panes ---------- */
.main { flex: 1; display: flex; min-height: 0; min-width: 0; background: var(--dock-b); }
.leftpane { flex: none; width: 196px; display: flex; flex-direction: column; background: #fff; border-right: 1px solid #6f93cf; min-height: 0; }
.lp-tabs { flex: none; display: flex; align-items: flex-end; gap: 2px; padding: 4px 4px 0 6px; background: linear-gradient(var(--tb-a), var(--tb-b)); border-bottom: 1px solid #7a96c6; }
.lp-tab { border: 1px solid #7a96c6; border-bottom: 0; background: linear-gradient(#fdfdfd, #e8eef9); padding: 2px 9px 3px; border-radius: 3px 3px 0 0; margin-bottom: -1px; cursor: default; }
.lp-tab.on { background: #fff; font-weight: bold; padding-bottom: 4px; }
.lp-close { margin-left: auto; align-self: center; border: 0; background: none; width: 16px; height: 16px; padding: 0; margin-bottom: 3px; }
.lp-close:hover { background: var(--menu-hot); outline: 1px solid var(--hot-border); }
.lp-body { flex: 1; overflow: auto; min-height: 0; position: relative; outline: none; }
.thumbs { display: flex; flex-direction: column; gap: 10px; padding: 10px 8px 14px 4px; }
.th { display: flex; align-items: flex-start; gap: 4px; position: relative; }
.th-num { flex: none; width: 18px; text-align: right; padding-top: 1px; color: #000; font-size: 11px; }
.th-meta { display: flex; flex-direction: column; align-items: flex-end; width: 18px; flex: none; gap: 3px; }
.th-star { width: 12px; height: 12px; cursor: pointer; }
.th-frame { flex: 0 0 auto; min-width: 0; border: 1px solid #a3a3a3; background: #fff; padding: 0; position: relative; cursor: default; }
.th.cur .th-frame { outline: 3px solid #3d6ec9; outline-offset: 0; border-color: #3d6ec9; }
.th.sel:not(.cur) .th-frame { outline: 2px solid #8fb0e6; }
.th.hiddenslide .th-frame { opacity: .45; }
.th.hiddenslide .th-num { text-decoration: line-through; }
.thumb-box { position: relative; overflow: hidden; background: #fff; pointer-events: none; }
.drop-line { position: absolute; left: 22px; right: 4px; height: 0; border-top: 2px solid #000; pointer-events: none; z-index: 5; }
.drop-line::before, .drop-line::after { content: ""; position: absolute; top: -5px; border: 4px solid transparent; }
.drop-line::before { left: -2px; border-left-color: #000; }
.drop-line::after { right: -2px; border-right-color: #000; }
.outline { padding: 6px 8px 20px; font: 12px/1.35 Arial, "Arimo", sans-serif; outline: none; min-height: 100%; white-space: pre-wrap; }
.ol-slide { display: flex; gap: 4px; margin-top: 4px; font-weight: bold; }
.ol-num { flex: none; width: 16px; text-align: right; font-weight: normal; }
.ol-ico { flex: none; width: 14px; height: 11px; margin-top: 2px; border: 1px solid #555; background: linear-gradient(#cfdcf3 0 35%, #fff 35%); }
.ol-title { flex: 1; min-width: 0; outline: none; }
.ol-body { margin-left: 34px; outline: none; }
.ol-line { position: relative; padding-left: 12px; min-height: 1.35em; }
.ol-line::before { content: "•"; position: absolute; left: 0; }
.ol-line[data-lvl="1"] { margin-left: 18px; } .ol-line[data-lvl="2"] { margin-left: 36px; } .ol-line[data-lvl="3"] { margin-left: 54px; } .ol-line[data-lvl="4"] { margin-left: 72px; }
.outline.plain .ol-body, .outline.plain .ol-title { font-weight: normal; }
.splitter { flex: none; background: transparent; }
.splitter.v { width: 4px; cursor: col-resize; margin-left: -2px; margin-right: -2px; z-index: 2; position: relative; }
.splitter.h { height: 5px; cursor: row-resize; background: linear-gradient(var(--tb-a), var(--tb-c)); border-top: 1px solid #6f93cf; }
.center { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.editor-wrap { flex: 1; min-height: 0; position: relative; display: grid; grid-template-columns: 0 1fr; grid-template-rows: 0 1fr; background: var(--work); }
.editor-wrap.with-rulers { grid-template-columns: 18px 1fr; grid-template-rows: 18px 1fr; }
.ruler { overflow: hidden; background: #fff; border-color: #8aa2c8; }
.ruler-h { grid-column: 2; grid-row: 1; border-bottom: 1px solid #8aa2c8; }
.ruler-v { grid-column: 1; grid-row: 2; border-right: 1px solid #8aa2c8; position: relative; }
.ruler-v canvas { position: absolute; left: 0; top: 0; }
.ed-scroll { grid-column: 2; grid-row: 2; position: relative; overflow: auto; outline: none; min-width: 0; min-height: 0; }
.ed-scroll.drawing { cursor: crosshair; }
.ed-scroll.painting, .ed-scroll.painting .shp { cursor: copy !important; }
.ed-canvas { position: relative; }
.ed-host { position: absolute; box-shadow: 3px 3px 0 #59657c; background: #fff; }
.ed-host > .sl { transform-origin: 0 0; }
.ed-host.gray > .sl { filter: grayscale(1); }
.ed-host.bw > .sl { filter: grayscale(1) contrast(30); }
.ed-grid { position: absolute; pointer-events: none; }
.ed-grid .guide { position: absolute; pointer-events: auto; }
.guide.gv { top: 0; bottom: 0; width: 7px; margin-left: -3px; cursor: col-resize; background: linear-gradient(90deg, transparent 3px, rgba(0,0,0,.55) 3px 4px, transparent 4px); background-size: 100% 4px; }
.guide.gh { left: 0; right: 0; height: 7px; margin-top: -3px; cursor: row-resize; background: linear-gradient(transparent 3px, rgba(0,0,0,.55) 3px 4px, transparent 4px); background-size: 4px 100%; }
.guide-tip { position: absolute; background: #ffffe1; border: 1px solid #000; padding: 0 3px; font-size: 10px; }
.ed-overlay { position: absolute; pointer-events: none; }
.ed-empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #333; font-size: 14px; cursor: pointer; }
.sel-frame { position: absolute; border: 1px solid rgba(0,0,0,.55); pointer-events: none; transform-origin: 50% 50%; }
.sel-frame.is-group { border-style: solid; }
.grp-frame { border: 1px dashed #666; }
.sel-frame.editing { border: 0; }
.edit-ring { position: absolute; inset: -5px; border: 5px solid transparent; pointer-events: auto; cursor: move;
  border-image: repeating-linear-gradient(45deg, #6b6b6b 0 1px, transparent 1px 3px) 5; }
.hd { position: absolute; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; background: #fff; border: 1px solid #000; pointer-events: auto; z-index: 2; }
.hd[data-h="nw"], .hd[data-h="se"] { cursor: nwse-resize; } .hd[data-h="ne"], .hd[data-h="sw"] { cursor: nesw-resize; }
.hd[data-h="n"], .hd[data-h="s"] { cursor: ns-resize; } .hd[data-h="e"], .hd[data-h="w"] { cursor: ew-resize; }
.hd-end { cursor: crosshair; }
.hd-rot { left: 50%; top: -22px; background: #3dd13d; border-color: #1a6b1a; cursor: grab; }
.hd-rotline { position: absolute; left: 50%; top: -18px; height: 18px; border-left: 1px solid #1a6b1a; }
.hd-adj { width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; border-radius: 0; background: #ffd400; border-color: #6b5800; transform: rotate(45deg); cursor: default; }
.hd[class*="crop-"], .hd[data-h^="crop-"] { border-radius: 0; width: 10px; height: 10px; margin: -5px 0 0 -5px; background: #000; border-color: #fff; }
.marquee { position: absolute; border: 1px dotted #000; background: rgba(49,106,197,.08); }
.draw-ghost { position: absolute; border: 1px dashed #000; }
.draw-ghost.line { border: 0; }
.cell-sel { position: absolute; background: rgba(0,0,0,.18); pointer-events: none; }
.notes { flex: none; height: 92px; background: #fff; overflow: auto; position: relative; border-top: 1px solid #6f93cf; }
.notes-in { min-height: 100%; padding: 6px 10px; font: 12px/1.35 Arial, "Arimo", sans-serif; outline: none; white-space: pre-wrap; }
.notes-in:empty::before { content: attr(data-ph); color: #888; }
.taskpane { flex: none; width: 262px; display: flex; flex-direction: column; background: linear-gradient(var(--pane-a), var(--pane-b)); border-left: 1px solid #6f93cf; min-height: 0; }
.tp-head { flex: none; display: flex; align-items: center; gap: 2px; padding: 3px 4px; background: linear-gradient(var(--tb-a), var(--tb-b) 50%, var(--tb-c)); border-bottom: 1px solid var(--tb-border); }
.tp-nav { width: 18px; height: 18px; border: 1px solid transparent; background: none; padding: 0; display: flex; align-items: center; justify-content: center; }
.tp-nav:not(:disabled):hover { background: var(--menu-hot); border-color: var(--hot-border); }
.tp-nav:disabled { opacity: .4; }
.tp-title { flex: 1; min-width: 0; font-weight: bold; color: #000; padding: 0 4px; display: flex; align-items: center; justify-content: space-between; border: 1px solid transparent; height: 20px; }
.tp-title:hover { border-color: var(--hot-border); background: var(--menu-hot); }
.tp-title span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tp-body { flex: 1; min-height: 0; overflow: auto; padding: 8px 8px 16px; }
.tp-sec { margin-bottom: 12px; }
.tp-h { font-weight: bold; color: var(--pane-ink); border-bottom: 1px solid #9db6e4; padding: 2px 0 3px; margin: 6px 0 6px; display: flex; align-items: center; gap: 4px; }
.tp-link { display: flex; align-items: center; gap: 6px; width: 100%; border: 0; background: none; text-align: left; color: var(--pane-link); padding: 3px 2px; cursor: pointer; }
.tp-link:hover span { text-decoration: underline; }
.tp-link:disabled { color: #888; cursor: default; }
.tp-row { display: flex; align-items: center; gap: 6px; margin: 5px 0; flex-wrap: wrap; }
.tp-row > label { min-width: 62px; }
.tp-row select, .tp-row input[type=text] { flex: 1; min-width: 0; }
.tp-btns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.tp-btn { min-width: 70px; }
.tp-note { color: var(--muted); margin: 4px 0; }
.lay-grid, .dsn-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 6px; }
.dsn-grid { grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); }
.lay-it, .dsn-it { border: 1px solid transparent; background: none; padding: 3px; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: default; position: relative; }
.lay-it:hover, .dsn-it:hover { border-color: var(--hot-border); background: var(--menu-hot); }
.lay-it.on, .dsn-it.on { border-color: var(--hot-border); background: var(--chk-a); }
.lay-it svg { display: block; background: #fff; border: 1px solid #999; }
.dsn-it .thumb-box { border: 1px solid #999; }
.dsn-it .dsn-dd { position: absolute; right: 3px; top: 3px; width: 14px; height: 14px; background: #fff; border: 1px solid #556; display: none; align-items: center; justify-content: center; }
.dsn-it:hover .dsn-dd { display: flex; }
.dsn-name { font-size: 10px; color: #222; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.scheme-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 6px; }
.scheme-it { border: 1px solid #999; background: #fff; padding: 4px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; cursor: default; }
.scheme-it:hover { outline: 2px solid var(--hot-border); }
.scheme-it span { height: 12px; border: 1px solid rgba(0,0,0,.25); }
.list-box { background: #fff; border: 1px solid var(--field-border); min-height: 120px; max-height: 260px; overflow: auto; }
.list-box .li { display: flex; align-items: center; gap: 4px; padding: 2px 4px; cursor: default; white-space: nowrap; }
.list-box .li.on { background: var(--sel); color: #fff; }
