# The macOS desktop app's Mac App Store edition (desktop/, docs/desktop.md, macOS), built on a Mac by
# desktop/macos/build.sh appstore: VibeOffice-macOS-AppStore.pkg, signed with Apple Distribution and Mac Installer
# Distribution, with the Mac App Store provisioning profile inside, uploaded to App Store Connect (TestFlight, then
# review). The pkg is also kept as an artifact (to upload with Transporter instead). The direct edition, the DMG, has
# a workflow of its own (macos.yml).
# The signing material lives in the "release" environment's secrets (docs/desktop.md lists them); the run fails
# without them. App Store Connect takes each build number once: the build number is the commit's time
# (macos/build.sh), so a commit uploads once.
# Run by hand only: Actions ▸ Mac App Store ▸ Run workflow.
name: Mac App Store

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload the package to App Store Connect (else keep it as the run's artifact only)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    environment: release
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-apple-darwin,x86_64-apple-darwin
          rustup default stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          key: desktop-macos-${{ hashFiles('desktop/Cargo.lock') }}

      # A keychain of this run's own, with the two certificates; the profile and the API key as files
      - name: Signing material
        env:
          APPSTORE_P12: ${{ secrets.MACOS_APPSTORE_P12 }}
          APPSTORE_PASSWORD: ${{ secrets.MACOS_APPSTORE_PASSWORD }}
          PROVISION_PROFILE: ${{ secrets.MACOS_PROVISION_PROFILE }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          for need in APPSTORE_P12 APPSTORE_PASSWORD PROVISION_PROFILE; do
            [ -n "${!need}" ] || { echo "::error::the release environment has no MACOS_$need secret (docs/desktop.md, macOS)"; exit 1; }
          done
          keychain="$RUNNER_TEMP/signing.keychain-db"
          pass=$(openssl rand -hex 24)
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          echo "$APPSTORE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$APPSTORE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pass" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v
          echo "$PROVISION_PROFILE" | base64 --decode > "$RUNNER_TEMP/appstore.provisionprofile"
          echo "MACOS_PROVISION_PROFILE=$RUNNER_TEMP/appstore.provisionprofile" >> "$GITHUB_ENV"
          if [ -n "$ASC_KEY_P8" ]; then
            mkdir -p ~/.appstoreconnect/private_keys
            echo "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          fi

      - name: Build
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: desktop/macos/build.sh appstore

      - uses: actions/upload-artifact@v4
        with:
          name: VibeOffice-macOS-AppStore
          path: desktop/target/dist/VibeOffice-macOS-AppStore.pkg
          if-no-files-found: error

      # altool finds the key in ~/.appstoreconnect/private_keys
      - name: App Store Connect
        if: inputs.upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcrun altool --upload-app --type macos --file desktop/target/dist/VibeOffice-macOS-AppStore.pkg \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Remove the keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -rf ~/.appstoreconnect
