# The Linux desktop app (desktop/, docs/desktop.md, Linux): VibeOffice-Linux-x86_64.AppImage, built on Ubuntu 22.04
# (glibc 2.35, the oldest system with WebKitGTK 4.1) so that it starts on every newer one that has WebKitGTK 4.1:
# Ubuntu 22.04 to 26.04, Debian 12 and 13, Fedora. The app uses the system's WebKitGTK, GTK and libsoup; AppRun says
# how to install WebKitGTK where it is missing.
# The AppImage goes into the version's GitHub release (tools/current-tree-version.sh), the same one as Windows and
# macOS; its name stays the same in every release, so releases/latest/download/VibeOffice-Linux-x86_64.AppImage is
# always the newest. With smoke ticked the run first tries it: the smoke run here on Ubuntu 22.04, and on each other
# system in a container, first without WebKitGTK (the install command must show), then with it
# (desktop/linux/on-system.sh); screenshots are artifacts, and the release waits for all of them to pass.
# Run by hand (Actions ▸ Linux ▸ Run workflow), or by release.yml with the other systems. Running it again on the same
# commit replaces the release's AppImage.
name: Linux

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Mark the release as a pre-release (when this run creates it)
        type: boolean
        default: false
      smoke:
        description: Try the AppImage first (Ubuntu 22.04, then each system in a container), with screenshots
        type: boolean
        default: false
  workflow_call:
    inputs:
      prerelease:
        type: boolean
        default: false
      smoke:
        type: boolean
        default: false

permissions:
  contents: write   # create the release and its tag

jobs:
  build:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev squashfs-tools
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          key: desktop-linux-${{ hashFiles('desktop/Cargo.lock') }}

      - name: Build
        id: build
        run: |
          desktop/linux/build.sh
          echo "version=$(tools/current-tree-version.sh)" >> "$GITHUB_OUTPUT"

      # here the AppImage mounts itself with FUSE, as on a desktop
      - name: Smoke (Ubuntu 22.04)
        if: inputs.smoke
        run: |
          sudo apt-get install -y --no-install-recommends fuse3 xvfb x11-utils imagemagick
          xvfb-run -a -s "-screen 0 1400x900x24" desktop/linux/smoke.sh desktop/target/dist/VibeOffice-Linux-x86_64.AppImage "$RUNNER_TEMP/smoke"

      - uses: actions/upload-artifact@v4
        if: always() && inputs.smoke
        with:
          name: VibeOffice-Linux-smoke-ubuntu-22.04
          path: ${{ runner.temp }}/smoke/*.*
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: VibeOffice-Linux-x86_64
          path: desktop/target/dist/VibeOffice-Linux-x86_64.AppImage
          if-no-files-found: error

  systems:
    needs: build
    if: inputs.smoke
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "ubuntu:24.04", name: ubuntu-24.04 }
          - { image: "ubuntu:26.04", name: ubuntu-26.04 }
          - { image: "debian:12", name: debian-12 }
          - { image: "debian:13", name: debian-13 }
          - { image: "fedora:latest", name: fedora }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: VibeOffice-Linux-x86_64
          path: dist

      # --privileged: WebKitGTK's web processes run in a bubblewrap sandbox, which a container allows only so
      - name: ${{ matrix.image }}
        run: |
          chmod 755 dist/VibeOffice-Linux-x86_64.AppImage
          mkdir -p "$RUNNER_TEMP/out"
          docker run --rm --privileged -v "$PWD:/repo:ro" -v "$RUNNER_TEMP/out:/out" "${{ matrix.image }}" \
            /repo/desktop/linux/on-system.sh /repo/dist/VibeOffice-Linux-x86_64.AppImage /out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VibeOffice-Linux-smoke-${{ matrix.name }}
          path: ${{ runner.temp }}/out/*.*
          if-no-files-found: warn

  # after the systems' tries when there are any (skipped without smoke), never after a failed one
  release:
    needs: [build, systems]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.systems.result != 'failure' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: VibeOffice-Linux-x86_64
          path: dist

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          files="dist/VibeOffice-Linux-x86_64.AppImage"
          if gh release view "$VERSION" > /dev/null 2>&1; then
            gh release upload "$VERSION" $files --clobber
          else
            flag=""
            [ "$PRERELEASE" = "true" ] && flag="--prerelease"
            gh release create "$VERSION" $files --target "$GITHUB_SHA" --title "VibeOffice $VERSION" $flag \
              --notes-file desktop/release-notes.md
          fi
