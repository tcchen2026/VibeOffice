<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400;0,700;1,400;1,700&family=Tinos:ital,wght@0,400;0,700;1,400;1,700&family=Cousine:ital,wght@0,400;0,700;1,400;1,700&family=Carlito:ital,wght@0,400;0,700;1,400;1,700&family=Caladea:ital,wght@0,400;0,700;1,400;1,700&display=swap">
<style>
/*CSS*/

<div id="app" class="app" aria-label="Ledger 2003 spreadsheet">
  <div class="titlebar" id="titlebar"><span id="appicon"></span><span class="title-text" id="titletext">Ledger 2003</span></div>
  <div class="cmdbars">
    <div class="menurow" id="menurow"></div>
    <div class="toolbars" id="toolbars"></div>
  </div>
  <div class="fbar" id="fbar">
    <div class="namebox" id="namebox-wrap"><input id="namebox" aria-label="Name Box" autocomplete="off" spellcheck="false"><button id="namebox-dd" type="button" tabindex="-1" aria-label="Names"><span class="dd-arrow"></span></button></div>
    <div class="fb-btns"><button class="fb-x" id="fb-cancel" type="button" aria-label="Cancel" data-tip="Cancel"></button><button class="fb-ok" id="fb-enter" type="button" aria-label="Enter" data-tip="Enter"></button><button id="fb-fx" type="button" aria-label="Insert Function" data-tip="Insert Function"></button></div>
    <div class="fb-edit"><textarea class="fb-input" id="fbinput" rows="1" aria-label="Formula Bar" spellcheck="false" autocomplete="off"></textarea></div>
  </div>
  <div class="main" id="main">
    <div class="center" id="center">
      <div class="gridwrap cur-cell" id="gridwrap" tabindex="0" aria-label="Worksheet grid" role="grid">
        <div class="glayer" id="glayer"></div>
        <div class="sb vscroll" id="vscroll"></div>
      </div>
      <div class="tabrow" id="tabrow">
        <div class="tabnav" id="tabnav"></div>
        <div class="tabs" id="tabs" role="tablist" aria-label="Sheets"></div>
        <div class="tabsplit" id="tabsplit" role="separator" aria-orientation="vertical"></div>
        <div class="sb hscroll" id="hscroll"></div>
        <div class="sb-corner"></div>
      </div>
    </div>
    <div class="taskpane" id="taskpane" hidden></div>
  </div>
  <div class="drawrow" id="drawrow" hidden></div>
  <div class="statusbar" id="statusbar"></div>
</div>
