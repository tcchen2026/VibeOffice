# The Docker image's server (Dockerfile; docs/suite.md, Self-hosting with Docker): the static files of public/.
# Every page carries its own Content-Security-Policy (tools/csp.mjs), so the server adds none.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # /quire to /quire/ by a relative address: an absolute one names the container's port, not the one published
    absolute_redirect off;

    # a page's 20 to 45 scripts must all be of one version: the browser asks each time, a 304 while unchanged
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml text/plain text/xml application/xml;

    location / {
        try_files $uri $uri/ =404;
    }
    # the PWA manifest (nginx's mime.types has no .webmanifest)
    location ~ \.webmanifest$ {
        types { }
        default_type application/manifest+json;
    }
}
