[package]
name = "dlnanything-demo"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
build = "build.rs"

[dependencies]
dlnanything = { path = ".." }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", default-features = false, features = ["wry", "compression", "common-controls-v6"] }
tokio = { version = "1", features = ["sync"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[patch.crates-io]
option-ext = { path = "patches/option-ext" }
